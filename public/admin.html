<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Panel Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    .admin-container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .admin-card {
      background: #111;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      color: #fff;
    }

    .admin-card h3 {
      margin-bottom: 10px;
    }

    .connected-user-row {
      border-bottom: 1px solid #333;
      padding: 6px 0;
      font-size: 13px;
    }

    input, select, button {
      margin: 5px 0;
      padding: 8px;
      border-radius: 6px;
      border: none;
    }

    button {
      cursor: pointer;
      background: #4e84ff;
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: #fff;
    }

    td, th {
      border-bottom: 1px solid #333;
      padding: 8px;
      text-align: left;
      font-size: 13px;
    }

    .dashboard-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.stat-box {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 14px;
}

.stat-box h4 {
  margin: 0 0 8px;
  font-size: 14px;
  color: #c8d7f0;
  font-weight: 500;
}

.stat-number {
  font-size: 28px;
  font-weight: 700;
  color: #fff;
}

#sessionsChart {
  width: 100%;
  background: rgba(255,255,255,0.03);
  border-radius: 10px;
  padding: 8px;
}

.connected-user-row {
  border-bottom: 1px solid #333;
  padding: 8px 0;
  font-size: 13px;
}

.admin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.admin-header-actions button {
  padding: 8px 14px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #4e84ff, #355cff);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.admin-header-actions button:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(78, 132, 255, 0.25);
}
  </style>
</head>


<body>

<div class="admin-container">

  <!--<h2>Panel de Administración</h2>-->

  <header class="admin-header">
    <h1>Panel de Administración</h1>

    <div class="admin-header-actions">
      <button id="backToPlayerBtn">⬅ Volver al reproductor</button>
    </div>
  </header>

  <!-- USUARIOS CONECTADOS -->
  <div class="admin-card">
    <h3>Usuarios conectados en tiempo real</h3>
    <p><strong id="connectedUsersCount">0</strong> usuarios</p>
    <p><strong id="connectedSessionsCount">0</strong> sesiones</p>
    <div id="connectedUsersList"></div>
  </div>

  <!-- CREAR USUARIO -->
  <div class="admin-card">
    <h3>Crear Usuario</h3>
    <input id="newUser" placeholder="Usuario" />
    <input id="newPass" placeholder="Contraseña" type="password" />
    <label for="newRole">Rol</label>
    <select id="newRole" aria-label="Seleccionar rol de usuario">
      <option value="user">Usuario</option>
      <option value="admin">Admin</option>
    </select>
    <button onclick="createUser()">Crear</button>
  </div>

  <!-- LISTA USUARIOS -->
  <div class="admin-card">
    <h3>Usuarios</h3>
    <table id="usersTable"></table>
  </div>

  <div class="admin-card dashboard-grid">
  <div class="stat-box">
    <h4>Usuarios conectados</h4>
    <div class="stat-number" id="connectedUsersCount">0</div>
  </div>

  <div class="stat-box">
    <h4>Sesiones activas</h4>
    <div class="stat-number" id="connectedSessionsCount">0</div>
  </div>

  <div class="stat-box">
    <h4>Total usuarios</h4>
    <div class="stat-number" id="totalUsersCount">0</div>
  </div>

  <div class="stat-box">
    <h4>Admins</h4>
    <div class="stat-number" id="adminsCount">0</div>
  </div>
</div>

<div class="admin-card">
  <h3>Actividad en tiempo real</h3>
  <canvas id="sessionsChart" height="120"></canvas>
</div>

<div class="admin-card">
  <h3>Usuarios conectados ahora</h3>
  <div id="connectedUsersList"></div>
</div>
</div>

<script>

  const backBtn = document.getElementById("backToPlayerBtn");

  if (backBtn) {
    backBtn.addEventListener("click", () => {
      window.location.href = "/";
    });
  }

  let sessionsHistory = [];
  const maxHistoryPoints = 20;

  // =========================
  // USUARIOS CONECTADOS
  // =========================

async function loadConnectedUsersSummary() {
  try {
    const res = await fetch("/admin/connected-users-summary");
    const data = await res.json();

    if (!res.ok || !data.ok) return;

    const connectedUsersCount = document.getElementById("connectedUsersCount");
    const connectedSessionsCount = document.getElementById("connectedSessionsCount");
    const connectedUsersList = document.getElementById("connectedUsersList");

    if (connectedUsersCount) {
      connectedUsersCount.textContent = data.connectedUsers;
    }

    if (connectedSessionsCount) {
      connectedSessionsCount.textContent = data.connectedSessions;
    }

    if (connectedUsersList) {
      connectedUsersList.innerHTML = data.sessions.map((s) => `
        <div class="connected-user-row">
          <strong>${s.username}</strong><br>
          <small>${s.ip_address || ""}</small><br>
          <small>Última actividad: ${s.last_seen}</small>
        </div>
      `).join("");
    }

    sessionsHistory.push(data.connectedSessions);
    if (sessionsHistory.length > maxHistoryPoints) {
      sessionsHistory.shift();
    }

    drawSessionsChart();
  } catch (e) {
    console.error("Error cargando conectados:", e);
  }
}

  loadConnectedUsersSummary();
  setInterval(loadConnectedUsersSummary, 5000);

  function drawSessionsChart() {
  const canvas = document.getElementById("sessionsChart");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");
  const width = canvas.width = canvas.offsetWidth;
  const height = canvas.height = 120;

  ctx.clearRect(0, 0, width, height);

  if (sessionsHistory.length < 2) return;

  const maxValue = Math.max(...sessionsHistory, 1);
  const stepX = width / (sessionsHistory.length - 1);

  ctx.beginPath();
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#4e84ff";

  sessionsHistory.forEach((value, index) => {
    const x = index * stepX;
    const y = height - (value / maxValue) * (height - 20) - 10;

    if (index === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  });

  ctx.stroke();

  sessionsHistory.forEach((value, index) => {
    const x = index * stepX;
    const y = height - (value / maxValue) * (height - 20) - 10;

    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = "#00c2ff";
    ctx.fill();
  });
}

function drawSessionsChart() {
  const canvas = document.getElementById("sessionsChart");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");
  const width = canvas.width = canvas.offsetWidth;
  const height = canvas.height = 120;

  ctx.clearRect(0, 0, width, height);

  if (sessionsHistory.length < 2) return;

  const maxValue = Math.max(...sessionsHistory, 1);
  const stepX = width / (sessionsHistory.length - 1);

  ctx.beginPath();
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#4e84ff";

  sessionsHistory.forEach((value, index) => {
    const x = index * stepX;
    const y = height - (value / maxValue) * (height - 20) - 10;

    if (index === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  });

  ctx.stroke();

  sessionsHistory.forEach((value, index) => {
    const x = index * stepX;
    const y = height - (value / maxValue) * (height - 20) - 10;

    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = "#00c2ff";
    ctx.fill();
  });
}

  // =========================
  // USUARIOS
  // =========================

  async function loadUsers() {
    const res = await fetch("/admin/users");
    const data = await res.json();

    if (!data.ok) return;

    const table = document.getElementById("usersTable");

    table.innerHTML = `
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Rol</th>
        <th>Sesiones</th>
        <th>Acciones</th>
      </tr>
    ` + data.users.map(u => `
      <tr>
        <td>${u.id}</td>
        <td>${u.username}</td>
        <td>${u.role}</td>
        <td>${u.active_sessions}</td>
        <td>
          <button onclick="deleteUser(${u.id})">Eliminar</button>
        </td>
      </tr>
    `).join("");
  }

  async function createUser() {
    const username = document.getElementById("newUser").value;
    const password = document.getElementById("newPass").value;
    const role = document.getElementById("newRole").value;

    await fetch("/admin/users", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, role })
    });

    loadUsers();
  }

  async function deleteUser(id) {
    await fetch("/admin/users/" + id, { method: "DELETE" });
    loadUsers();
  }

  loadUsers();
</script>

</body>
</html>
